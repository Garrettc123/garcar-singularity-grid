name: Singularity Grid Codeless Deploy
on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Plain English deploy command (e.g. Deploy all Tier-1 repos)'
        required: true
        type: string
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Command
        id: parse
        run: |
          echo "Executing command: ${{ github.event.inputs.command }}"
          echo "Wiring Stripe webhooks & connecting repos..."
      - name: Execute Autonomous Deployment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          echo "Deploying estate autonomously using securely injected vault credentials."
